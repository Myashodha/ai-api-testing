[project]
name = "ai-api-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "tenacity>=9.1.4",
]

[project.scripts]
ai-api-testing = "ai_api_testing:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = [
    "live: calls the real API (slow, uses rate limit)",
    "negative: sends invalid input or expects failure",
    "slow: sends very large inputs (uses quota)",
]
timeout = 60
testpaths = ["tests"]
addopts = "--alluredir=allure-results"

