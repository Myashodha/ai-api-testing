name: AI API Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run tests and publish Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest tests/ -v --tb=short -m "not slow"

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: |
          curl -Ls https://github.com/allure-framework/allure2/releases/download/2.33.0/allure-commandline-2.33.0.tgz -o allure.tgz
          mkdir -p /tmp/allure
          tar -xzf allure.tgz -C /tmp/allure --strip-components=1
          echo "/tmp/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure HTML report
        if: always()
        run: |
          mkdir -p allure-report
          allure generate allure-results --clean -o allure-report

      - name: Publish report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/gh-pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch gh-pages https://github.com/${{ github.repository }}.git /tmp/gh-pages
          else
            mkdir -p /tmp/gh-pages
            git -C /tmp/gh-pages init
            git -C /tmp/gh-pages checkout --orphan gh-pages
          fi

          rm -rf /tmp/gh-pages/*
          cp -R allure-report/* /tmp/gh-pages/

          git -C /tmp/gh-pages add .
          git -C /tmp/gh-pages commit -m "Deploy Allure report" || true
          git -C /tmp/gh-pages push --force https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git gh-pages
