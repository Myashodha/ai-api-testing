name: AI API Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run tests and publish Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest tests/ -v --tb=short -m "not slow"

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: |
          set -e
          ALLURE_VERSION="2.33.0"
          ALLURE_URL="https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"

          echo "Downloading Allure from: ${ALLURE_URL}"
          mkdir -p /tmp/allure-download
          cd /tmp/allure-download

          for attempt in 1 2 3; do
            if curl -L -f -o allure.tgz "${ALLURE_URL}"; then
              echo "Download successful on attempt ${attempt}"
              break
            else
              echo "Download failed on attempt ${attempt}, retrying..."
              sleep 5
            fi
          done

          if file allure.tgz | grep -q "gzip"; then
            echo "File is a valid gzip archive"
          else
            echo "ERROR: Downloaded file is not a valid gzip archive"
            file allure.tgz || true
            head -c 100 allure.tgz | od -c || true
            exit 1
          fi

          tar -xzf allure.tgz
          echo "/tmp/allure-download/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
          allure --version

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            echo "Generating Allure report from results..."
            mkdir -p allure-report
            allure generate allure-results --clean -o allure-report
            echo "Report generated successfully"
          else
            echo "No allure-results found, skipping report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No test results available</h1></body></html>" > allure-report/index.html
          fi

      - name: Publish report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/gh-pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch gh-pages https://github.com/${{ github.repository }}.git /tmp/gh-pages
          else
            mkdir -p /tmp/gh-pages
            git -C /tmp/gh-pages init
            git -C /tmp/gh-pages checkout --orphan gh-pages
          fi

          rm -rf /tmp/gh-pages/*

          if [ -d "allure-report" ] && [ "$(ls -A allure-report)" ]; then
            cp -R allure-report/* /tmp/gh-pages/
          else
            echo "No allure-report found"
            exit 1
          fi

          git -C /tmp/gh-pages add .
          git -C /tmp/gh-pages commit -m "Deploy Allure report" || true
          git -C /tmp/gh-pages push --force https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git gh-pages
