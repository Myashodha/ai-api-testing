name: AI API Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # needed to push the report to the gh-pages branch

jobs:
  test:
    name: Run tests and publish Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest tests/ -v --tb=short -m "not slow"
        # allure results are written by addopts in pyproject.toml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Get previous Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true            # the gh-pages branch doesn't exist on the first run
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure HTML report
        if: always()
        uses: simple-elf/allure-report-action@v2.0
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
